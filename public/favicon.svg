<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Background: gray window -->
  <rect width="32" height="32" fill="#c0c0c0"/>

  <!-- Window title bar -->
  <rect x="2" y="2" width="28" height="8" fill="#000080"/>

  <!-- Title bar dots -->
  <rect x="4" y="5" width="2" height="2" fill="white"/>
  <rect x="7" y="5" width="2" height="2" fill="white"/>
  <rect x="10" y="5" width="2" height="2" fill="white"/>

  <!-- Close button in titlebar -->
  <rect x="26" y="3" width="4" height="6" fill="#c0c0c0"/>
  <rect x="27" y="4" width="1" height="4" fill="#404040"/>
  <rect x="28" y="4" width="1" height="4" fill="#404040"/>

  <!-- Window body (sunken) -->
  <rect x="2" y="10" width="28" height="20" fill="white"/>
  <!-- inner shadow top/left -->
  <rect x="2" y="10" width="28" height="1" fill="#808080"/>
  <rect x="2" y="10" width="1" height="20" fill="#808080"/>

  <!-- Checkbox 1 (checked) -->
  <rect x="5" y="14" width="5" height="5" fill="white"/>
  <rect x="5" y="14" width="5" height="1" fill="#808080"/>
  <rect x="5" y="14" width="1" height="5" fill="#808080"/>
  <!-- checkmark -->
  <rect x="6" y="16" width="1" height="2" fill="#000080"/>
  <rect x="7" y="17" width="1" height="1" fill="#000080"/>
  <rect x="8" y="15" width="1" height="2" fill="#000080"/>

  <!-- Line 1 -->
  <rect x="12" y="15" width="14" height="2" fill="#000080"/>

  <!-- Checkbox 2 (unchecked) -->
  <rect x="5" y="21" width="5" height="5" fill="white"/>
  <rect x="5" y="21" width="5" height="1" fill="#808080"/>
  <rect x="5" y="21" width="1" height="5" fill="#808080"/>

  <!-- Line 2 -->
  <rect x="12" y="22" width="11" height="2" fill="#404040"/>

  <!-- Outer raised border -->
  <rect x="0" y="0" width="32" height="1"  fill="white"/>
  <rect x="0" y="0" width="1"  height="32" fill="white"/>
  <rect x="0" y="31" width="32" height="1" fill="#404040"/>
  <rect x="31" y="0" width="1" height="32" fill="#404040"/>
  <rect x="1" y="1" width="30" height="1"  fill="#dfdfdf"/>
  <rect x="1" y="1" width="1"  height="30" fill="#dfdfdf"/>
  <rect x="1" y="30" width="30" height="1" fill="#808080"/>
  <rect x="30" y="1" width="1" height="30" fill="#808080"/>
</svg>
